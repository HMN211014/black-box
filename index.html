<title>Black BOX</title>
<style>
:root{--bg:#000;--fg:#f5f5f7;--muted:#98989d;--glass:rgba(40,40,44,.72);--r:22px}
*{box-sizing:border-box;margin:0}
html{-webkit-text-size-adjust:100%}
html,body{background:var(--bg);color:var(--fg);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",Inter,Arial,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;min-height:100dvh;padding:56px 0 0;background:linear-gradient(180deg,#000 0,#000 45%,#040714 70%,#0a1f5c 100%) no-repeat}
header{padding:0 5vw;margin-bottom:28px;display:flex;align-items:baseline;gap:16px}
h1{font-size:clamp(34px,5vw,56px);font-weight:700;letter-spacing:-.03em}
header p{color:var(--muted);font-size:17px}
.hero{position:relative;margin:0 5vw;height:clamp(420px,64vh,660px);border-radius:28px;overflow:hidden;background:var(--g);box-shadow:0 30px 80px rgba(0,0,0,.7);isolation:isolate}
.hero::before{content:"";position:absolute;inset:0;background:var(--img,none) center/cover;z-index:-2}
.hero video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:-1}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,rgba(0,0,0,.88) 0,rgba(0,0,0,.35) 45%,transparent 75%),linear-gradient(90deg,rgba(0,0,0,.55),transparent 60%)}
.hcopy{position:absolute;left:clamp(22px,4vw,56px);right:clamp(22px,4vw,56px);bottom:clamp(26px,5vw,56px);z-index:1;max-width:620px;transition:opacity .25s,transform .25s}
.hero.out .hcopy{opacity:0;transform:translateY(8px)}
.hmeta{color:#d1d1d6;font-size:15px}
.hcopy h2{font-size:clamp(34px,6vw,68px);letter-spacing:-.035em;line-height:1;margin:8px 0 12px}
.hd{font-size:clamp(15px,1.6vw,18px);line-height:1.45;color:#ececf0;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;max-width:52ch}
.hact{display:flex;gap:12px;margin-top:20px;flex-wrap:wrap}
.dots{position:absolute;right:24px;bottom:28px;display:flex;gap:10px;z-index:1}
.dots button{position:relative;width:8px;height:8px;border-radius:8px;border:0;padding:0;background:rgba(255,255,255,.4);cursor:pointer;transition:width .25s,background .25s}
.dots button::after{content:"";position:absolute;inset:-10px}
.dots button.on{width:26px;background:#fff}
.rt{padding:0 5vw;margin-top:40px;font-size:22px;letter-spacing:-.02em}
.end{margin-top:56px;padding:110px 5vw calc(56px + env(safe-area-inset-bottom,0px));text-align:center;background:radial-gradient(90% 100% at 50% 130%,#1f80e0 0,#113CCF 35%,rgba(17,60,207,0) 72%),radial-gradient(45% 70% at 12% 110%,rgba(28,207,211,.55),transparent 70%),radial-gradient(45% 70% at 90% 110%,rgba(120,80,255,.4),transparent 70%)}
.end b{display:block;font-size:clamp(28px,5vw,44px);letter-spacing:-.03em;margin-bottom:6px}
.end span{color:#b8c7ff;font-size:15px}
.end small{display:block;margin-top:18px;color:rgba(184,199,255,.6);font-size:12px}
.row{position:relative}
.track{overscroll-behavior-x:contain;-webkit-overflow-scrolling:touch;display:flex;gap:22px;overflow-x:auto;scroll-snap-type:x mandatory;padding:26px 5vw 40px;scroll-padding:0 5vw;scrollbar-width:none}
.track::-webkit-scrollbar{display:none}
.card{-webkit-tap-highlight-color:transparent;flex:0 0 clamp(170px,19vw,260px);aspect-ratio:2/3;border:0;border-radius:var(--r);position:relative;overflow:hidden;cursor:pointer;scroll-snap-align:start;color:#fff;text-align:left;
  background:var(--g);box-shadow:0 10px 30px rgba(0,0,0,.6);transition:transform .25s ease,box-shadow .25s ease;transform-style:preserve-3d;will-change:transform}
.card:hover,.card:focus-visible{box-shadow:0 26px 60px rgba(0,0,0,.85),0 0 0 3px rgba(255,255,255,.9);z-index:2}
.card:focus-visible{outline:none}
.card img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.card .t{position:absolute;left:16px;right:16px;bottom:16px;font-size:clamp(18px,2vw,24px);font-weight:700;letter-spacing:-.02em;line-height:1.1;text-shadow:0 2px 12px rgba(0,0,0,.5)}
.card .shine{position:absolute;inset:0;background:radial-gradient(circle at var(--mx,50%) var(--my,0%),rgba(255,255,255,.28),transparent 55%);opacity:0;transition:opacity .25s}
.card:hover .shine{opacity:1}
.nav{position:absolute;top:50%;transform:translateY(-60%);width:48px;height:48px;border-radius:50%;border:0;background:var(--glass);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);color:#fff;font-size:22px;cursor:pointer;z-index:3;opacity:0;transition:opacity .2s}
.row:hover .nav,.nav:focus-visible{opacity:1}
.nav.prev{left:1.5vw}.nav.next{right:1.5vw}
@media(hover:none){.nav{display:none}}
dialog{border:0;padding:0;background:transparent;color:var(--fg);max-width:min(860px,92vw);width:100%;margin:auto}
dialog::backdrop{background:rgba(0,0,0,.6);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
dialog[open]{animation:pop .28s cubic-bezier(.2,.9,.3,1.2)}
@keyframes pop{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:none}}
.sheet{display:grid;grid-template-columns:minmax(150px,260px) 1fr;gap:32px;padding:32px;border-radius:32px;background:var(--glass);backdrop-filter:blur(40px) saturate(1.6);-webkit-backdrop-filter:blur(40px) saturate(1.6);box-shadow:0 40px 100px rgba(0,0,0,.7)}
.sheet .poster{aspect-ratio:2/3;border-radius:18px;background:var(--g);position:relative;overflow:hidden}
.sheet .poster img{width:100%;height:100%;object-fit:cover}
.info{display:flex;flex-direction:column;justify-content:center;gap:14px}
.info h2{font-size:clamp(26px,4vw,40px);letter-spacing:-.03em;line-height:1.05}
.meta{color:var(--muted);font-size:15px}
.desc{font-size:17px;line-height:1.5;color:#e5e5ea;max-width:52ch}
.actions{display:flex;gap:12px;margin-top:10px;flex-wrap:wrap}
.btn{-webkit-tap-highlight-color:transparent;display:inline-block;padding:13px 28px;border-radius:999px;font-size:16px;font-weight:600;text-decoration:none;border:0;cursor:pointer;font-family:inherit}
.btn.primary{background:#fff;color:#000}
.btn.ghost{background:rgba(255,255,255,.16);color:#fff}
.btn:focus-visible{outline:3px solid #fff;outline-offset:3px}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
@media(max-width:620px){
  body{padding-top:calc(36px + env(safe-area-inset-top,0px))}
 .hero{margin:0 20px;height:clamp(440px,66vh,560px);border-radius:22px}
 .hcopy{left:20px;right:20px;bottom:56px}
 .dots{left:20px;right:auto;bottom:22px}
 .hact .btn{width:auto;flex:1;min-height:48px;padding:14px 16px}
 .rt{padding:0 20px;margin-top:28px;font-size:20px}
 .end{padding-top:80px}
 header{flex-direction:column;gap:4px;align-items:flex-start;padding:0 20px}
 header p{font-size:15px}
 .track{gap:14px;padding:18px 20px 32px;scroll-padding:0 20px}
 .card{flex-basis:58vw;max-width:240px;border-radius:18px}
 .card .t{font-size:20px;left:14px;right:14px;bottom:14px}
 dialog{max-width:100%;max-height:92vh;max-height:92dvh;margin:auto 0 0 0}
 dialog[open]{animation:up .32s cubic-bezier(.2,.9,.3,1)}
 .sheet{grid-template-columns:1fr;gap:18px;padding:22px 20px calc(24px + env(safe-area-inset-bottom,0px));border-radius:28px 28px 0 0;max-height:92vh;max-height:92dvh;overflow-y:auto}
 .sheet .poster{width:120px;justify-self:center}
 .info{text-align:center;align-items:center}
 .desc{font-size:16px}
 .actions{flex-direction:column;width:100%}
 .btn{width:100%;text-align:center;min-height:50px;padding:15px 24px}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ---- Sensación de app: sin zoom, sin selección, sin rebote ---- */
html,body{touch-action:pan-x pan-y;overscroll-behavior-y:none;-webkit-touch-callout:none}
body{-webkit-user-select:none;user-select:none}
.btn:disabled{opacity:.5;cursor:default}

/* ---- Reproductor propio (subpágina encima de la principal) ---- */
#player{position:fixed;inset:0;z-index:100;background:#000;color:#fff;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;
 --st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px);--sl:env(safe-area-inset-left,0px);--sr:env(safe-area-inset-right,0px)}
#player[hidden]{display:none}
#pv{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#000}
#pdrive{position:absolute;inset:0;padding:0 var(--sr) 0 var(--sl)}
#pdrive iframe{display:block;width:100%;height:100%;border:0;background:#000}
#player.drive #pv,#player.drive .pmid,#player.drive .pbot,#player.drive .spin{display:none}
#player.drive .ptop{opacity:1}
#player.drive .ptop button{pointer-events:auto}
.ctl{position:absolute;left:0;right:0;pointer-events:none;opacity:0;transition:opacity .25s}
#player.c .ctl{opacity:1}
.ctl button,.ctl input{pointer-events:none}
#player.c .ctl button,#player.c .ctl input{pointer-events:auto}
.ptop{top:0;display:flex;align-items:center;gap:6px;padding:calc(var(--st) + 10px) calc(var(--sr) + 16px) 34px calc(var(--sl) + 12px);background:linear-gradient(180deg,rgba(0,0,0,.55),transparent)}
.ptitle{font-size:17px;font-weight:600;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 1px 6px rgba(0,0,0,.6)}
.pmid{top:50%;transform:translateY(-50%);display:flex;justify-content:center;align-items:center;gap:clamp(28px,12vw,96px)}
.pbot{bottom:0;padding:38px calc(var(--sr) + 20px) calc(var(--sb) + 10px) calc(var(--sl) + 20px);background:linear-gradient(0deg,rgba(0,0,0,.6),transparent)}
.prow{display:flex;align-items:center;gap:12px;font-size:14px;font-variant-numeric:tabular-nums;text-shadow:0 1px 4px rgba(0,0,0,.6)}
.pact{display:flex;align-items:center;gap:4px;margin-top:2px}
.grow{flex:1}
.ib{display:grid;place-items:center;width:44px;height:44px;border:0;border-radius:50%;background:transparent;color:#fff;cursor:pointer;-webkit-tap-highlight-color:transparent;font-family:inherit;font-weight:600;font-size:15px}
.ib svg{width:26px;height:26px;fill:currentColor;stroke:none;filter:drop-shadow(0 1px 4px rgba(0,0,0,.5))}
.ib.big{width:58px;height:58px}.ib.big svg{width:40px;height:40px}
.ib.huge{width:80px;height:80px}.ib.huge svg{width:62px;height:62px}
.ib.txt{width:auto;padding:0 12px;border-radius:999px}
.ib:focus-visible{outline:2px solid #fff;outline-offset:2px}
svg.st{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
svg.st text{fill:currentColor;stroke:none}
.seek{-webkit-appearance:none;appearance:none;flex:1;min-width:0;height:30px;margin:0;background:transparent;cursor:pointer;touch-action:none;--p:0%;--b:0%}
.seek:focus{outline:none}
.seek::-webkit-slider-runnable-track{height:4px;border-radius:4px;background:linear-gradient(90deg,#fff 0 var(--p),rgba(255,255,255,.5) var(--p) var(--b),rgba(255,255,255,.22) var(--b) 100%)}
.seek::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;margin-top:-6px;border-radius:50%;border:0;background:#fff;box-shadow:0 1px 6px rgba(0,0,0,.6)}
.seek::-moz-range-track{height:4px;border-radius:4px;background:linear-gradient(90deg,#fff 0 var(--p),rgba(255,255,255,.5) var(--p) var(--b),rgba(255,255,255,.22) var(--b) 100%)}
.seek::-moz-range-thumb{width:16px;height:16px;border-radius:50%;border:0;background:#fff;box-shadow:0 1px 6px rgba(0,0,0,.6)}
.spin{position:absolute;left:50%;top:50%;width:54px;height:54px;margin:-27px 0 0 -27px;border:4px solid rgba(255,255,255,.25);border-top-color:#fff;border-radius:50%;animation:giro .9s linear infinite;opacity:0;pointer-events:none;transition:opacity .2s}
#player.wait .spin{opacity:1}
@keyframes giro{to{transform:rotate(360deg)}}
.perr{position:absolute;inset:0;display:grid;place-content:center;text-align:center;padding:24px;color:#d1d1d6;font-size:16px;line-height:1.5;pointer-events:none}
.perr[hidden]{display:none}
@media (pointer:coarse){#pfs{display:none}}
@media (orientation:portrait) and (pointer:coarse) and (max-width:900px){
 #player:not(:fullscreen){inset:auto;top:0;left:0;width:100vh;width:100dvh;height:100vw;height:100dvw;transform-origin:top left;transform:rotate(90deg) translateY(-100%);
  --st:env(safe-area-inset-right,0px);--sb:env(safe-area-inset-left,0px);--sl:env(safe-area-inset-top,0px);--sr:env(safe-area-inset-bottom,0px)}
}
#cdlg{max-width:min(380px,90vw);margin:auto}
.cbox{padding:28px 24px;border-radius:28px;background:var(--glass);backdrop-filter:blur(40px) saturate(1.6);-webkit-backdrop-filter:blur(40px) saturate(1.6);box-shadow:0 40px 100px rgba(0,0,0,.7);display:flex;flex-direction:column;gap:14px;text-align:center}
.cbox h2{font-size:22px;letter-spacing:-.02em}
#cin{width:100%;padding:14px 16px;border-radius:14px;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.1);color:#fff;font-size:18px;font-family:inherit;text-align:center;letter-spacing:.1em;outline:none;-webkit-user-select:text;user-select:text}
#cin:focus{border-color:#fff}
#cer{color:#ff8a80;font-size:14px;min-height:18px}
</style>

<script>
/* ============================================================
   AQUÍ AGREGAS TUS PELÍCULAS. Solo necesitas:  titulo  y  link
   (enlace directo .mp4 H.264/AAC, .m3u8, o un enlace de Google Drive).
   Año, género, duración, descripción, póster y fondo del banner
   los trae solo TMDB. Campos opcionales:
     buscar:"..."  -> otro nombre para buscar en TMDB (p. ej. el título original)
     tmdb:1234567  -> número exacto de la película en themoviedb.org
   Cualquier dato que escribas a mano (anio, genero, duracion,
   descripcion, poster, fondo, trailer) tiene prioridad sobre TMDB.
   ============================================================ */
const peliculas = [
  { titulo:"Spiderman:Brand New day", buscar:"Spider-Man: Brand New Day",
    link:"https://pub-1443424c5a904f3298903a419ccb22c9.r2.dev/%5BPeliculasBluray.Com%5D%20Spider-Man%20Un%20nuevo%20d%C3%ADa%20(2026)%20%5B720P%5D%5BHD%5D.mp4" },
  { titulo:"Coyote vs Acme", buscar:"Coyote vs. Acme",
    link:"https://drive.google.com/file/d/1FToLhskC3P-QbVfO_jfNT0UlrAmhoDEc/view?usp=drivesdk" },
  { titulo:"El hombre que desafio al rey",
    link:"https://pub-1443424c5a904f3298903a419ccb22c9.r2.dev/%5BPeliculasBluray.Com%5D%20El%20hombre%20que%20desafi%C3%B3%20al%20rey%20(2026)%20%5B720P%5D%5BHD%5D.mp4" },
  { titulo:"El Corazon de la bestia",
    link:"https://pub-1443424c5a904f3298903a419ccb22c9.r2.dev/El%20coraz%C3%B3n%20de%20la%20bestia%20(2026)%20%5BAudio-Latino%5D%5BHDTS%5D.mp4" },
  { titulo:"Michael",
    link:"https://pub-1443424c5a904f3298903a419ccb22c9.r2.dev/Michael.2026.DVDRip-Lat.mp4" },
  { titulo:"Paw Patrol: Dino Movie", buscar:"PAW Patrol: The Dino Movie",
    link:"https://pub-1443424c5a904f3298903a419ccb22c9.r2.dev/%5BPeliculasBluray.Com%5D%20Paw%20Patrol%20La%20dino%20pel%C3%ADcula%20(2026)%20%5B720P%5D%5BHD%5D.mp4" },
  { titulo:"Él final de Oak Street", buscar:"The End of Oak Street",
    link:"https://pub-1443424c5a904f3298903a419ccb22c9.r2.dev/THE%20END%20OF%20OAK%20STREAT.mp4" },
  { titulo:"Evil Dead: En llamas", buscar:"Evil Dead Burn",
    link:"https://pub-1443424c5a904f3298903a419ccb22c9.r2.dev/Evil.Dead.En.llamas.2026.720p-Dual-Lat.mkv" }
];

/* ============================================================
   CÓDIGOS DE ACCESO. Uno por película; la clave es el título EXACTO.
   Cámbialos por los tuyos. Una película que no esté aquí se abre sin código.
   ============================================================ */
/* CÓDIGO MAESTRO: al escribirlo una vez, este dispositivo ya no pide código en ninguna película.
   Cámbialo por el tuyo. */
const CODIGO_MAESTRO = "BB141099";

/* CÓDIGO TEMPORAL: siempre es el mismo. Da 1 hora de acceso total al dispositivo donde se escribe,
   y en ese dispositivo no se puede volver a usar. Cámbialo por el tuyo. */
const CODIGO_TEMPORAL = "BB-TEMP-5824";
const TEMP_MS = 60 * 60 * 1000;

const CODIGOS = {
  "Spiderman:Brand New day": "SPIDER1",
  "Coyote vs Acme": "COYOTE1",
  "El hombre que desafio al rey": "REY1",
  "El Corazon de la bestia": "BESTIA1",
  "Paw Patrol: Dino Movie": "DINO1",
  "Evil Dead: En llamas": "EVIL1",
  "Él final de Oak Street": "OAK1",
};

/* ---------- TMDB: completa los datos de cada película ----------
   La página se dibuja al instante; los datos se rellenan solos al llegar
   (y quedan guardados en el dispositivo para la próxima vez). */
const TMDB_KEY = "28e735f7aea07e37f38a95d346bcdd7f";
const TMDB = "https://api.themoviedb.org/3", IMG = "https://image.tmdb.org/t/p/";
const clave = p => "tmdb2:" + (p.tmdb || p.buscar || p.titulo);
function aplicar(p, d) {
  let cambio = false;
  for (const f in d) if (d[f] && !p[f]) { p[f] = d[f]; cambio = true; }
  return cambio;
}
function deCache(p) {
  try { const d = JSON.parse(localStorage.getItem(clave(p))); if (d) aplicar(p, d); } catch (e) {}
}
async function completar(p) {
  if (!TMDB_KEY || TMDB_KEY.startsWith("TU_")) return false;
  try {
    if (JSON.parse(localStorage.getItem(clave(p)))) return false;   // ya estaba guardado
  } catch (e) {}
  try {
    const j = u => fetch(u, { signal: AbortSignal.timeout(8000) }).then(r => r.json());
    let id = p.tmdb;
    if (!id) {
      const y = p.anio ? "&year=" + p.anio : "";
      const s = await j(`${TMDB}/search/movie?api_key=${TMDB_KEY}&language=es-MX&query=${encodeURIComponent(p.buscar || p.titulo)}${y}`);
      if (!s.results || !s.results[0]) return false;
      id = s.results[0].id;
    }
    const x = await j(`${TMDB}/movie/${id}?api_key=${TMDB_KEY}&language=es-MX`);
    if (!x || !x.id) return false;
    const r = x.runtime;
    const d = {
      anio: (x.release_date || "").slice(0, 4),
      genero: (x.genres || []).map(g => g.name).join(", "),
      duracion: r ? Math.floor(r / 60) + " h " + (r % 60) + " min" : "",
      descripcion: x.overview || "",
      poster: x.poster_path ? IMG + "w500" + x.poster_path : "",
      fondo: x.backdrop_path ? IMG + "w1280" + x.backdrop_path : ""
    };
    try { localStorage.setItem(clave(p), JSON.stringify(d)); } catch (e) {}
    return aplicar(p, d);
  } catch (e) { return false; }
}
peliculas.forEach(deCache);          // lo que ya se guardó sale al instante
const tarjetas = new Map();

const track = document.getElementById('track'), dlg = document.getElementById('dlg');
const grad = t => { let h = 0; for (const c of t) h = (h*31 + c.charCodeAt(0)) % 360;
  return `linear-gradient(155deg,hsl(${h} 55% 38%),hsl(${(h+50)%360} 60% 14%))`; };
const poster = (p, el) => {
  el.style.setProperty('--g', grad(p.titulo));
  if (p.poster) { const i = new Image(); i.alt = ''; i.src = p.poster; i.onerror = () => i.remove(); el.prepend(i); }
};

peliculas.forEach(p => {
  const b = document.createElement('button');
  b.className = 'card'; b.setAttribute('aria-label', p.titulo);
  b.innerHTML = '<span class="t"></span><span class="shine"></span>';
  b.querySelector('.t').textContent = p.titulo;
  poster(p, b);
  b.addEventListener('click', () => abrir(p));
  b.addEventListener('pointermove', e => {
    if (e.pointerType !== 'mouse' || matchMedia('(prefers-reduced-motion:reduce)').matches) return;
    const r = b.getBoundingClientRect(), x = (e.clientX - r.left)/r.width, y = (e.clientY - r.top)/r.height;
    b.style.transform = `perspective(700px) rotateY(${(x-.5)*14}deg) rotateX(${(.5-y)*14}deg) scale(1.06)`;
    b.style.setProperty('--mx', x*100+'%'); b.style.setProperty('--my', y*100+'%');
  });
  b.addEventListener('pointerleave', () => b.style.transform = '');
  b.addEventListener('focus', () => b.style.transform = 'scale(1.06)');
  b.addEventListener('blur', () => b.style.transform = '');
  track.appendChild(b); tarjetas.set(p, b);
});

let abierta = null;
function abrir(p) {
  abierta = p;
  document.getElementById('dt').textContent = p.titulo;
  document.getElementById('dm').textContent = [p.anio, p.genero, p.duracion].filter(Boolean).join('  ·  ');
  document.getElementById('dd').textContent = p.descripcion;
  document.getElementById('dl').textContent = p.link ? 'Ver ahora' : 'Próximamente';
  document.getElementById('dl').disabled = !p.link;
  document.getElementById('dl').onclick = () => reproducir(p);
  const dp = document.getElementById('dp'); dp.innerHTML = ''; poster(p, dp);
  if (!dlg.open) dlg.showModal();
}
document.getElementById('dc').onclick = () => dlg.close();
dlg.addEventListener('click', e => { if (e.target === dlg) dlg.close(); });

const paso = () => track.clientWidth * .8;
document.querySelector('.prev').onclick = () => track.scrollBy({left:-paso(), behavior:'smooth'});
document.querySelector('.next').onclick = () => track.scrollBy({left: paso(), behavior:'smooth'});

/* ---------- Banner destacado: películas al azar ---------- */
const H = id => document.getElementById(id);
const hero = H('hero'), hv = H('hv'), reduce = matchMedia('(prefers-reduced-motion:reduce)').matches;
const orden = [...peliculas].sort(() => Math.random() - .5);
let idx = 0, timer;
orden.forEach((p, i) => {
  const d = document.createElement('button');
  d.setAttribute('aria-label', p.titulo);
  d.onclick = () => { mostrar(i); auto(); };
  H('dots').appendChild(d);
});
function mostrar(i) {
  idx = i; const p = orden[i];
  hero.classList.add('out');
  setTimeout(() => {
    hero.style.setProperty('--g', grad(p.titulo));
    const bg = p.fondo || p.poster;
    hero.style.setProperty('--img', bg ? `url("${bg}")` : 'none');
    H('hm').textContent = [p.anio, p.genero, p.duracion].filter(Boolean).join('  ·  ');
    H('ht').textContent = p.titulo;
    H('hd').textContent = p.descripcion;
    H('hl').textContent = p.link ? 'Ver ahora' : 'Próximamente'; H('hl').disabled = !p.link; H('hl').onclick = () => reproducir(p);
    H('hi').onclick = () => abrir(p);
    if (p.trailer && !reduce) { hv.src = p.trailer; hv.hidden = false; hv.play().catch(() => { hv.hidden = true; }); }
    else { hv.hidden = true; hv.removeAttribute('src'); hv.load(); }
    [...H('dots').children].forEach((d, k) => d.classList.toggle('on', k === i));
    hero.classList.remove('out');
  }, reduce ? 0 : 250);
}
function auto() {
  clearInterval(timer);
  if (reduce || orden.length < 2) return;
  timer = setInterval(() => { if (!dlg.open && pl.hidden && !document.hidden) mostrar((idx + 1) % orden.length); }, 9000);
}
mostrar(0); auto();

/* ---------- Reproductor propio (subpágina estilo Disney+) ---------- */
const pl = H('player'), V = H('pv'), ps = H('ps'), coarse = matchMedia('(pointer:coarse)').matches;
const ICON = {
  play: '<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>',
  pause: '<svg viewBox="0 0 24 24"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>',
  vol: '<svg class="st" viewBox="0 0 24 24"><path d="M4 9.5v5h3.5L12 18.5v-13L7.5 9.5H4z" style="fill:currentColor"/><path d="M15.5 9a4 4 0 0 1 0 6M18 6.5a8 8 0 0 1 0 11"/></svg>',
  mute: '<svg class="st" viewBox="0 0 24 24"><path d="M4 9.5v5h3.5L12 18.5v-13L7.5 9.5H4z" style="fill:currentColor"/><path d="M16 9.5l5 5M21 9.5l-5 5"/></svg>'
};
const VEL = [1, 1.25, 1.5, 2, 0.75];
let hideT, dragging = false, hls = null, fsAuto = false, vi = 0;

const fmt = s => { s = Math.max(0, Math.floor(s || 0)); const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), x = s % 60;
  return (h ? h + ':' + String(m).padStart(2, '0') : m) + ':' + String(x).padStart(2, '0'); };
const driveId = u => { const m = (u || '').match(/\/d\/([\w-]+)/) || (u || '').match(/[?&]id=([\w-]+)/); return m ? m[1] : null; };
const duracion = () => isFinite(V.duration) ? V.duration : 0;

function showC() {
  pl.classList.add('c'); clearTimeout(hideT);
  if (!V.paused && !dragging) hideT = setTimeout(() => pl.classList.remove('c'), 3000);
}
function hideC() { clearTimeout(hideT); pl.classList.remove('c'); }
function sync() {
  const d = duracion(), c = dragging ? +ps.value : V.currentTime;
  if (!dragging) ps.value = V.currentTime;
  H('pc').textContent = fmt(c);
  H('pd').textContent = '-' + fmt(d - c);
  const p = d ? c / d * 100 : 0; let b = 0;
  try { if (d && V.buffered.length) b = V.buffered.end(V.buffered.length - 1) / d * 100; } catch (e) {}
  ps.style.setProperty('--p', p + '%'); ps.style.setProperty('--b', Math.max(p, b) + '%');
}
function fallo() {
  H('per').textContent = 'No se pudo reproducir este video. Revisa que el enlace sea directo y que el archivo sea .mp4 (H.264/AAC) o .m3u8.';
  H('per').hidden = false; pl.classList.remove('wait'); showC();
}
function saltar(d) { V.currentTime = Math.min(Math.max(0, V.currentTime + d), duracion() || Infinity); sync(); }
function alternar() { if (V.paused) V.play().catch(() => {}); else V.pause(); }
function cargarHls() {
  return window.Hls ? Promise.resolve(window.Hls) : new Promise((ok, ko) => {
    const s = document.createElement('script');
    s.src = 'https://cdnjs.cloudflare.com/ajax/libs/hls.js/1.5.8/hls.min.js';
    s.onload = () => ok(window.Hls); s.onerror = ko; document.head.appendChild(s);
  });
}
function cargar(url) {
  if (hls) { hls.destroy(); hls = null; }
  if (/\.m3u8(\?|$)/i.test(url) && !V.canPlayType('application/vnd.apple.mpegurl')) {
    cargarHls().then(Hls => {
      if (!Hls.isSupported()) throw 0;
      hls = new Hls(); hls.loadSource(url); hls.attachMedia(V);
      hls.on(Hls.Events.ERROR, (_, d) => { if (d.fatal) fallo(); });
      V.play().catch(() => {});
    }).catch(fallo);
  } else { V.src = url; V.play().catch(() => {}); }
}
async function horizontal() {
  if (!coarse) return;
  let fs = false;
  try { if (pl.requestFullscreen) { await pl.requestFullscreen(); fs = true; fsAuto = true; } } catch (e) {}
  try { await screen.orientation.lock('landscape'); }
  catch (e) { /* si no se puede bloquear, el CSS gira el reproductor */
    if (fs && matchMedia('(orientation:portrait)').matches) { fsAuto = false; try { await document.exitFullscreen(); } catch (_) {} }
  }
}
function iniciar(p, url) {
  const id = driveId(url);
  H('pt').textContent = p.titulo; H('per').hidden = true;
  pl.classList.remove('wait'); pl.classList.toggle('drive', !!id);
  H('pdrive').innerHTML = '';
  vi = 0; V.playbackRate = 1; V.muted = false;
  H('px').textContent = '1x'; H('pm').innerHTML = ICON.vol; H('pp').innerHTML = ICON.play;
  ps.value = 0; ps.max = 0; sync();
  pl.hidden = false;
  document.body.style.overflow = 'hidden';
  if (id) H('pdrive').innerHTML = '<iframe src="https://drive.google.com/file/d/' + id + '/preview" allow="autoplay"></iframe>';
  else cargar(url);
  history.pushState({player: 1}, '');
  showC(); horizontal();
}
const cdlg = H('cdlg'), cin = H('cin'), cer = H('cer'); let cpeli = null;
let tempFin = 0;
const temporal = () => { try { tempFin = Math.max(tempFin, +localStorage.getItem('bbtemp_fin') || 0); } catch (e) {} return Date.now() < tempFin; };
const tempUsado = () => { try { return !!localStorage.getItem('bbtemp_fin'); } catch (e) { return tempFin > 0; } };
let maestroOk = false;
const maestro = () => { try { return maestroOk || localStorage.getItem('bbmaster') === CODIGO_MAESTRO; } catch (e) { return maestroOk; } };
function reproducir(p) {
  if (!p.link) return;
  if (dlg.open) dlg.close();
  if (!CODIGOS[p.titulo] || maestro() || temporal()) { iniciar(p, p.link); return; }
  cpeli = p; cin.value = ''; cer.textContent = '';
  H('cm').textContent = p.titulo; cdlg.showModal(); setTimeout(() => cin.focus(), 60);
}
function validar() {
  const p = cpeli, c = cin.value.trim().toLowerCase();
  if (!c) { cer.textContent = 'Escribe el código.'; return; }
  if (c === CODIGO_TEMPORAL.toLowerCase()) {
    if (tempUsado()) { cer.textContent = 'Este código ya se usó en este dispositivo.'; return; }
    tempFin = Date.now() + TEMP_MS; try { localStorage.setItem('bbtemp_fin', tempFin); } catch (e) {}
  } else if (c === CODIGO_MAESTRO.toLowerCase()) {
    maestroOk = true; try { localStorage.setItem('bbmaster', CODIGO_MAESTRO); } catch (e) {}
  } else if (String(CODIGOS[p.titulo]).trim().toLowerCase() !== c) { cer.textContent = 'Código incorrecto.'; return; }
  cdlg.close(); iniciar(p, p.link);
}
H('cok').onclick = validar;
H('cno').onclick = () => cdlg.close();
cin.addEventListener('keydown', e => { if (e.key === 'Enter') validar(); });
cdlg.addEventListener('click', e => { if (e.target === cdlg) cdlg.close(); });

/* Relación de aspecto: Ajustar = se ve completo (barras negras); Llenar = cubre la pantalla recortando bordes. Nunca deforma. */
let fit = 'contain';
try { if (localStorage.getItem('bbfit') === 'cover') fit = 'cover'; } catch (e) {}
function aplicarFit() { V.style.objectFit = fit; H('pa').textContent = fit === 'cover' ? 'Llenar' : 'Ajustar'; }
H('pa').onclick = () => { fit = fit === 'cover' ? 'contain' : 'cover'; try { localStorage.setItem('bbfit', fit); } catch (e) {} aplicarFit(); };
aplicarFit();

function cerrarPlayer(desdePop) {
  if (pl.hidden) return;
  pl.hidden = true; clearTimeout(hideT); pl.classList.remove('c', 'wait');
  V.pause(); if (hls) { hls.destroy(); hls = null; }
  V.removeAttribute('src'); V.load(); H('pdrive').innerHTML = '';
  document.body.style.overflow = '';
  if (document.fullscreenElement) { fsAuto = false; try { document.exitFullscreen().catch(() => {}); } catch (e) {} }
  try { screen.orientation.unlock(); } catch (e) {}
  if (!desdePop && history.state && history.state.player) history.back();
}

V.addEventListener('loadedmetadata', () => { ps.max = duracion(); sync(); });
V.addEventListener('durationchange', () => { ps.max = duracion(); sync(); });
V.addEventListener('timeupdate', sync);
V.addEventListener('progress', sync);
V.addEventListener('play', () => { H('pp').innerHTML = ICON.pause; showC(); });
V.addEventListener('pause', () => { H('pp').innerHTML = ICON.play; showC(); });
V.addEventListener('waiting', () => pl.classList.add('wait'));
V.addEventListener('playing', () => pl.classList.remove('wait'));
V.addEventListener('canplay', () => pl.classList.remove('wait'));
V.addEventListener('error', () => { if (!pl.hidden && V.getAttribute('src')) fallo(); });

ps.addEventListener('input', () => { dragging = true; sync(); showC(); });
ps.addEventListener('change', () => { V.currentTime = +ps.value; dragging = false; sync(); showC(); });
H('pp').onclick = alternar;
H('pr').onclick = () => saltar(-10);
H('pfw').onclick = () => saltar(10);
H('pb').onclick = () => cerrarPlayer();
H('pm').onclick = () => { V.muted = !V.muted; H('pm').innerHTML = V.muted ? ICON.mute : ICON.vol; };
H('px').onclick = () => { vi = (vi + 1) % VEL.length; V.playbackRate = VEL[vi]; H('px').textContent = VEL[vi] + 'x'; };
H('pfs').onclick = () => {
  if (document.fullscreenElement) document.exitFullscreen().catch(() => {});
  else if (pl.requestFullscreen) pl.requestFullscreen().catch(() => {});
};
/* tocar fuera de los controles los oculta / los muestra */
pl.addEventListener('click', e => {
  if (pl.classList.contains('drive')) return;
  if (e.target.closest('button,input')) { showC(); return; }
  if (pl.classList.contains('c')) hideC(); else showC();
});
document.addEventListener('fullscreenchange', () => { if (!document.fullscreenElement && fsAuto) { fsAuto = false; cerrarPlayer(); } });
addEventListener('popstate', () => cerrarPlayer(true));
addEventListener('keydown', e => {
  if (pl.hidden) return;
  const k = e.key;
  if (k === ' ' && e.target.closest('button')) return;
  if (k === 'Escape') cerrarPlayer();
  else if (k === ' ' || k === 'k') { e.preventDefault(); alternar(); showC(); }
  else if (k === 'ArrowRight') { saltar(10); showC(); }
  else if (k === 'ArrowLeft') { saltar(-10); showC(); }
  else if (k === 'f') H('pfs').click();
  else if (k === 'm') H('pm').click();
  else if (k === 'a') H('pa').click();
});
H('pp').innerHTML = ICON.play; H('pm').innerHTML = ICON.vol;

/* sin zoom de pellizco en iOS */
document.addEventListener('gesturestart', e => e.preventDefault());

/* ---------- Al llegar los datos de TMDB, actualizar lo que ya está en pantalla ---------- */
function refrescar(p) {
  const b = tarjetas.get(p);
  if (b && !b.querySelector('img')) poster(p, b);
  if (orden[idx] === p) mostrar(idx);
  if (dlg.open && abierta === p) abrir(p);
}
peliculas.forEach(p => completar(p).then(c => { if (c) refrescar(p); }));
</script>
</body>
</html>
