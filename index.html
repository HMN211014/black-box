<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content">
<title>Black BOX</title>
<style>
:root{--bg:#000;--fg:#f5f5f7;--muted:#98989d;--glass:rgba(40,40,44,.72);--r:22px}
*{box-sizing:border-box;margin:0}
html{-webkit-text-size-adjust:100%}
html,body{background:var(--bg);color:var(--fg);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",Inter,Arial,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;min-height:100dvh;padding:56px 0 0;background:linear-gradient(180deg,#000 0,#000 45%,#040714 70%,#0a1f5c 100%) no-repeat}
header{padding:0 5vw;margin-bottom:28px;display:flex;align-items:baseline;gap:16px}
h1{font-size:clamp(34px,5vw,56px);font-weight:700;letter-spacing:-.03em}
header p{color:var(--muted);font-size:17px}
.hero{position:relative;margin:0 5vw;height:clamp(420px,64vh,660px);border-radius:28px;overflow:hidden;background:var(--g);box-shadow:0 30px 80px rgba(0,0,0,.7);isolation:isolate}
.hero::before{content:"";position:absolute;inset:0;background:var(--img,none) center/cover;z-index:-2}
.hero video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:-1}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,rgba(0,0,0,.88) 0,rgba(0,0,0,.35) 45%,transparent 75%),linear-gradient(90deg,rgba(0,0,0,.55),transparent 60%)}
.hcopy{position:absolute;left:clamp(22px,4vw,56px);right:clamp(22px,4vw,56px);bottom:clamp(26px,5vw,56px);z-index:1;max-width:620px;transition:opacity .18s,transform .18s}
.hero.out .hcopy{opacity:0;transform:translateY(8px)}
.hmeta{color:#d1d1d6;font-size:15px}
.hcopy h2{font-size:clamp(34px,6vw,68px);letter-spacing:-.035em;line-height:1;margin:8px 0 12px}
.hd{font-size:clamp(15px,1.6vw,18px);line-height:1.45;color:#ececf0;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;max-width:52ch}
.hact{display:flex;gap:12px;margin-top:20px;flex-wrap:wrap}
.dots{position:absolute;right:24px;bottom:28px;display:flex;gap:10px;z-index:1}
.dots button{position:relative;width:8px;height:8px;border-radius:8px;border:0;padding:0;background:rgba(255,255,255,.4);cursor:pointer;transition:width .25s,background .25s}
.dots button::after{content:"";position:absolute;inset:-10px}
.dots button.on{width:26px;background:#fff}
.rt{padding:0 5vw;margin-top:40px;font-size:22px;letter-spacing:-.02em}
.end{margin-top:56px;padding:110px 5vw calc(56px + env(safe-area-inset-bottom,0px));text-align:center;background:radial-gradient(90% 100% at 50% 130%,#1f80e0 0,#113CCF 35%,rgba(17,60,207,0) 72%),radial-gradient(45% 70% at 12% 110%,rgba(28,207,211,.55),transparent 70%),radial-gradient(45% 70% at 90% 110%,rgba(120,80,255,.4),transparent 70%)}
.end b{display:block;font-size:clamp(28px,5vw,44px);letter-spacing:-.03em;margin-bottom:6px}
.end span{color:#b8c7ff;font-size:15px}
.end small{display:block;margin-top:18px;color:rgba(184,199,255,.6);font-size:12px}
.row{position:relative}
.track{overscroll-behavior-x:contain;-webkit-overflow-scrolling:touch;display:flex;gap:22px;overflow-x:auto;scroll-snap-type:x mandatory;padding:26px 5vw 40px;scroll-padding:0 5vw;scrollbar-width:none}
.track::-webkit-scrollbar{display:none}
.card{-webkit-tap-highlight-color:transparent;flex:0 0 clamp(170px,19vw,260px);aspect-ratio:2/3;border:0;border-radius:var(--r);position:relative;overflow:hidden;cursor:pointer;scroll-snap-align:start;color:#fff;text-align:left;
  background:var(--g);box-shadow:0 10px 30px rgba(0,0,0,.6);transition:transform .25s ease,box-shadow .25s ease;transform-style:preserve-3d;will-change:transform}
.card:hover,.card:focus-visible{box-shadow:0 26px 60px rgba(0,0,0,.85),0 0 0 3px rgba(255,255,255,.9);z-index:2}
.card:focus-visible{outline:none}
.card img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.card .t{position:absolute;left:16px;right:16px;bottom:16px;font-size:clamp(18px,2vw,24px);font-weight:700;letter-spacing:-.02em;line-height:1.1;text-shadow:0 2px 12px rgba(0,0,0,.5)}
.card .shine{position:absolute;inset:0;background:radial-gradient(circle at var(--mx,50%) var(--my,0%),rgba(255,255,255,.28),transparent 55%);opacity:0;transition:opacity .25s}
.card:hover .shine{opacity:1}
.nav{position:absolute;top:50%;transform:translateY(-60%);width:48px;height:48px;border-radius:50%;border:0;background:var(--glass);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);color:#fff;font-size:22px;cursor:pointer;z-index:3;opacity:0;transition:opacity .2s}
.row:hover .nav,.nav:focus-visible{opacity:1}
.nav.prev{left:1.5vw}.nav.next{right:1.5vw}
@media(hover:none){.nav{display:none}}
dialog{border:0;padding:0;background:transparent;color:var(--fg);max-width:min(860px,92vw);width:100%;margin:auto}
dialog::backdrop{background:rgba(0,0,0,.6);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
dialog[open]{animation:pop .28s cubic-bezier(.2,.9,.3,1.2)}
@keyframes pop{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:none}}
.sheet{display:grid;grid-template-columns:minmax(150px,260px) 1fr;gap:32px;padding:32px;border-radius:32px;background:var(--glass);backdrop-filter:blur(40px) saturate(1.6);-webkit-backdrop-filter:blur(40px) saturate(1.6);box-shadow:0 40px 100px rgba(0,0,0,.7)}
.sheet .poster{aspect-ratio:2/3;border-radius:18px;background:var(--g);position:relative;overflow:hidden}
.sheet .poster img{width:100%;height:100%;object-fit:cover}
.info{display:flex;flex-direction:column;justify-content:center;gap:14px}
.info h2{font-size:clamp(26px,4vw,40px);letter-spacing:-.03em;line-height:1.05}
.meta{color:var(--muted);font-size:15px}
.desc{font-size:17px;line-height:1.5;color:#e5e5ea;max-width:52ch}
.actions{display:flex;gap:12px;margin-top:10px;flex-wrap:wrap}
.btn{-webkit-tap-highlight-color:transparent;display:inline-block;padding:13px 28px;border-radius:999px;font-size:16px;font-weight:600;text-decoration:none;border:0;cursor:pointer;font-family:inherit}
.btn.primary{background:#fff;color:#000}
.btn.ghost{background:rgba(255,255,255,.16);color:#fff}
.btn:focus-visible{outline:3px solid #fff;outline-offset:3px}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
@media(max-width:620px){
  body{padding-top:calc(36px + env(safe-area-inset-top,0px))}
 .hero{margin:0 20px;height:clamp(440px,66vh,560px);border-radius:22px}
 .hcopy{left:20px;right:20px;bottom:56px}
 .dots{left:20px;right:auto;bottom:22px}
 .hact .btn{width:auto;flex:1;min-height:48px;padding:14px 16px}
 .rt{padding:0 20px;margin-top:28px;font-size:20px}
 .end{padding-top:80px}
 header{flex-direction:column;gap:4px;align-items:flex-start;padding:0 20px}
 header p{font-size:15px}
 .track{gap:14px;padding:18px 20px 32px;scroll-padding:0 20px}
 .card{flex-basis:58vw;max-width:240px;border-radius:18px}
 .card .t{font-size:20px;left:14px;right:14px;bottom:14px}
 dialog{max-width:100%;max-height:92vh;max-height:92dvh;margin:auto 0 0 0}
 dialog[open]{animation:up .32s cubic-bezier(.2,.9,.3,1)}
 .sheet{grid-template-columns:1fr;gap:18px;padding:22px 20px calc(24px + env(safe-area-inset-bottom,0px));border-radius:28px 28px 0 0;max-height:92vh;max-height:92dvh;overflow-y:auto}
 .sheet .poster{width:120px;justify-self:center}
 .info{text-align:center;align-items:center}
 .desc{font-size:16px}
 .actions{flex-direction:column;width:100%}
 .btn{width:100%;text-align:center;min-height:50px;padding:15px 24px}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ---- Sensación de app: sin zoom, sin selección, sin rebote ---- */
html,body{touch-action:pan-x pan-y;overscroll-behavior-y:none;-webkit-touch-callout:none}
body{-webkit-user-select:none;user-select:none}
.btn:disabled{opacity:.5;cursor:default}

/* ---- Reproductor propio (subpágina encima de la principal) ---- */
#player{position:fixed;inset:0;z-index:100;background:#000;color:#fff;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;
 --st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px);--sl:env(safe-area-inset-left,0px);--sr:env(safe-area-inset-right,0px)}
#player[hidden]{display:none}
#pv{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#000}
#pdrive{position:absolute;inset:0;padding:0 var(--sr) 0 var(--sl)}
#pdrive iframe{display:block;width:100%;height:100%;border:0;background:#000}
#player.drive #pv,#player.drive .pmid,#player.drive .pbot,#player.drive .spin{display:none}
#player.drive .ptop{opacity:1}
#player.drive .ptop button{pointer-events:auto}
.ctl{position:absolute;left:0;right:0;pointer-events:none;opacity:0;transition:opacity .25s}
#player.c .ctl{opacity:1}
.ctl button,.ctl input{pointer-events:none}
#player.c .ctl button,#player.c .ctl input{pointer-events:auto}
.ptop{top:0;display:flex;align-items:center;gap:6px;padding:calc(var(--st) + 10px) calc(var(--sr) + 16px) 34px calc(var(--sl) + 12px);background:linear-gradient(180deg,rgba(0,0,0,.55),transparent)}
.ptitle{font-size:17px;font-weight:600;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 1px 6px rgba(0,0,0,.6)}
.pmid{top:50%;transform:translateY(-50%);display:flex;justify-content:center;align-items:center;gap:clamp(28px,12vw,96px)}
.pbot{bottom:0;padding:38px calc(var(--sr) + 20px) calc(var(--sb) + 10px) calc(var(--sl) + 20px);background:linear-gradient(0deg,rgba(0,0,0,.6),transparent)}
.prow{display:flex;align-items:center;gap:12px;font-size:14px;font-variant-numeric:tabular-nums;text-shadow:0 1px 4px rgba(0,0,0,.6)}
.pact{display:flex;align-items:center;gap:4px;margin-top:2px}
.grow{flex:1}
.ib{display:grid;place-items:center;width:44px;height:44px;border:0;border-radius:50%;background:transparent;color:#fff;cursor:pointer;-webkit-tap-highlight-color:transparent;font-family:inherit;font-weight:600;font-size:15px}
.ib svg{width:26px;height:26px;fill:currentColor;stroke:none;filter:drop-shadow(0 1px 4px rgba(0,0,0,.5))}
.ib.big{width:58px;height:58px}.ib.big svg{width:40px;height:40px}
.ib.huge{width:80px;height:80px}.ib.huge svg{width:62px;height:62px}
.ib.txt{width:auto;padding:0 12px;border-radius:999px}
.ib:focus-visible{outline:2px solid #fff;outline-offset:2px}
svg.st{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
svg.st text{fill:currentColor;stroke:none}
.seek{-webkit-appearance:none;appearance:none;flex:1;min-width:0;height:30px;margin:0;background:transparent;cursor:pointer;touch-action:none;--p:0%;--b:0%}
.seek:focus{outline:none}
.seek::-webkit-slider-runnable-track{height:4px;border-radius:4px;background:linear-gradient(90deg,#fff 0 var(--p),rgba(255,255,255,.5) var(--p) var(--b),rgba(255,255,255,.22) var(--b) 100%)}
.seek::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;margin-top:-6px;border-radius:50%;border:0;background:#fff;box-shadow:0 1px 6px rgba(0,0,0,.6)}
.seek::-moz-range-track{height:4px;border-radius:4px;background:linear-gradient(90deg,#fff 0 var(--p),rgba(255,255,255,.5) var(--p) var(--b),rgba(255,255,255,.22) var(--b) 100%)}
.seek::-moz-range-thumb{width:16px;height:16px;border-radius:50%;border:0;background:#fff;box-shadow:0 1px 6px rgba(0,0,0,.6)}
.spin{position:absolute;left:50%;top:50%;width:54px;height:54px;margin:-27px 0 0 -27px;border:4px solid rgba(255,255,255,.25);border-top-color:#fff;border-radius:50%;animation:giro .9s linear infinite;opacity:0;pointer-events:none;transition:opacity .2s}
#player.wait .spin{opacity:1}
@keyframes giro{to{transform:rotate(360deg)}}
.perr{position:absolute;inset:0;display:grid;place-content:center;text-align:center;padding:24px;color:#d1d1d6;font-size:16px;line-height:1.5;pointer-events:none}
.perr[hidden]{display:none}
@media (pointer:coarse){#pfs{display:none}}
@media (orientation:portrait) and (pointer:coarse) and (max-width:900px){
 #player:not(:fullscreen){inset:auto;top:0;left:0;width:100vh;width:100dvh;height:100vw;height:100dvw;transform-origin:top left;transform:rotate(90deg) translateY(-100%);
  --st:env(safe-area-inset-right,0px);--sb:env(safe-area-inset-left,0px);--sl:env(safe-area-inset-top,0px);--sr:env(safe-area-inset-bottom,0px)}
}
.cbox{padding:28px 24px;border-radius:28px;background:var(--glass);backdrop-filter:blur(40px) saturate(1.6);-webkit-backdrop-filter:blur(40px) saturate(1.6);box-shadow:0 40px 100px rgba(0,0,0,.7);display:flex;flex-direction:column;gap:14px;text-align:center}
.cbox h2{font-size:22px;letter-spacing:-.02em}

/* ---------- Sombreado suave (estilo streaming) para separar texto y portada ---------- */
.hcopy::before{content:"";position:absolute;inset:-60px -70px -50px -50px;z-index:-1;pointer-events:none;background:radial-gradient(ellipse 85% 80% at 25% 70%,rgba(0,0,0,.42),rgba(0,0,0,.18) 55%,transparent 80%)}
.hmeta,.hcopy h2,.hd{text-shadow:0 1px 14px rgba(0,0,0,.4)}
.card::after{content:"";position:absolute;left:0;right:0;bottom:0;height:55%;z-index:1;pointer-events:none;background:linear-gradient(0deg,rgba(0,0,0,.62),rgba(0,0,0,.22) 55%,transparent)}
.card .t{z-index:2}

/* ---------- Animación de entrada (estilo Disney+) ---------- */
.sin-intro #intro{display:none}
#intro{position:fixed;inset:0;z-index:100000;background:#000;display:flex;align-items:center;justify-content:center;overflow:hidden;touch-action:none;opacity:1;transition:opacity .7s ease,transform .7s ease}
#intro.fuera{opacity:0;transform:scale(1.08);pointer-events:none}
#intro .glow{position:absolute;inset:0;background:radial-gradient(ellipse 60% 45% at 50% 52%,rgba(24,72,255,.42),rgba(10,20,80,.18) 55%,transparent 75%);opacity:0;animation:iGlow 2.6s .15s ease-out forwards}
#intro .stars{position:absolute;inset:0}
#intro .stars i{position:absolute;width:var(--s);height:var(--s);border-radius:50%;background:#cfe0ff;box-shadow:0 0 6px 1px rgba(150,190,255,.9);opacity:0;animation:iStar var(--d) var(--t) ease-in-out infinite}
#intro .centro{position:relative;width:min(88vw,560px);display:flex;flex-direction:column;align-items:center}
#intro svg{width:100%;height:auto;overflow:visible;display:block}
#intro .arco{fill:none;stroke-linecap:round;stroke-dasharray:1;stroke-dashoffset:1;animation:iArco 1.5s .25s cubic-bezier(.45,.05,.2,1) forwards}
#intro .arco.a{stroke:url(#gArco);stroke-width:3}
#intro .arco.b{stroke:#fff;stroke-width:9;filter:blur(7px);opacity:.65}
#intro .logo{margin-top:-52px;width:clamp(86px,22vw,128px);height:auto;border-radius:24%;opacity:0;transform:scale(.6);filter:blur(14px);animation:iLogo 1.1s 1s cubic-bezier(.2,.8,.2,1) forwards,iPulso 1.6s 2.1s ease-in-out 1}
#intro .nombre{margin-top:18px;font:600 clamp(13px,3.6vw,18px)/1 -apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",Arial,sans-serif;color:#fff;text-transform:uppercase;letter-spacing:.9em;padding-left:.9em;opacity:0;animation:iNombre 1.2s 1.55s ease-out forwards}
@keyframes iArco{to{stroke-dashoffset:0}}
@keyframes iGlow{0%{opacity:0}45%{opacity:1}100%{opacity:.85}}
@keyframes iLogo{to{opacity:1;transform:scale(1);filter:blur(0) drop-shadow(0 0 26px rgba(70,130,255,.65))}}
@keyframes iPulso{50%{filter:blur(0) drop-shadow(0 0 44px rgba(110,160,255,.95))}}
@keyframes iNombre{from{opacity:0;letter-spacing:.9em}to{opacity:.92;letter-spacing:.34em}}
@keyframes iStar{0%,100%{opacity:0;transform:scale(.4)}50%{opacity:var(--o);transform:scale(1)}}
@media (prefers-reduced-motion:reduce){
  #intro .arco,#intro .glow,#intro .logo,#intro .nombre{animation-duration:.01s;animation-delay:0s}
  #intro .stars{display:none}
}

/* ---------- Resplandor detrás del banner (color del póster) ---------- */
@property --glow{syntax:'<color>';inherits:true;initial-value:#1f4fff}
.herowrap{position:relative;--glow:#1f4fff;transition:--glow .9s ease}
.herowrap::before{content:"";position:absolute;left:calc(5vw - 8px);right:calc(5vw - 8px);top:12%;bottom:-14px;z-index:0;pointer-events:none;background:var(--glow);border-radius:36px;filter:blur(52px);opacity:.62}
.hero{position:relative;z-index:1;box-shadow:0 0 0 1px rgba(255,255,255,.06)}

/* ---------- Buscador (arriba a la derecha) ---------- */
.card[hidden]{display:none}
.buscar{position:relative;margin-left:auto;align-self:center;display:flex;align-items:center;width:clamp(150px,22vw,240px);height:40px;border-radius:999px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.14);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);z-index:5;transition:width .3s cubic-bezier(.2,.9,.3,1),background .2s,border-color .2s}
.buscar:focus-within{width:clamp(220px,32vw,340px);background:rgba(255,255,255,.16);border-color:rgba(255,255,255,.5)}
.buscar svg{position:absolute;left:13px;width:17px;height:17px;pointer-events:none;color:var(--muted)}
.buscar input{width:100%;height:100%;padding:0 38px;border:0;border-radius:999px;background:transparent;color:var(--fg);font:inherit;font-size:16px;outline:none;-webkit-appearance:none;appearance:none;-webkit-user-select:text;user-select:text}
.buscar input::placeholder{color:var(--muted)}
.buscar input::-webkit-search-cancel-button,.buscar input::-webkit-search-decoration{-webkit-appearance:none;display:none}
.buscar .x{position:absolute;right:6px;width:28px;height:28px;border:0;border-radius:50%;background:rgba(255,255,255,.2);color:#fff;font-size:13px;line-height:1;cursor:pointer;display:none;place-items:center;-webkit-tap-highlight-color:transparent}
.buscar.lleno .x{display:grid}
.sinres{padding:0 5vw 40px;color:var(--muted);font-size:17px}
.sinres[hidden]{display:none}
@media(max-width:620px){
 .herowrap::before{left:12px;right:12px;bottom:-10px;filter:blur(40px)}
 header{position:relative}
 .buscar{position:absolute;right:20px;top:0;margin:0;width:132px;height:38px}
 .buscar:focus-within{width:calc(100vw - 40px)}
 .sinres{padding:0 20px 32px}
}

/* ---------- Switcher superior (liquid glass): Películas | Suscripciones ---------- */
.buscar[hidden]{display:none}
.sw{--x:5px;--w:100px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 10px);z-index:30;display:flex;width:max-content;max-width:calc(100% - 40px);margin:0 auto 24px;padding:5px;border-radius:999px;
  background:linear-gradient(180deg,rgba(255,255,255,.14),rgba(255,255,255,.05));border:1px solid rgba(255,255,255,.16);
  backdrop-filter:blur(26px) saturate(1.8);-webkit-backdrop-filter:blur(26px) saturate(1.8);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.4),inset 0 -1px 0 rgba(255,255,255,.06),0 14px 40px rgba(0,0,0,.5)}
.sw i{position:absolute;left:0;top:5px;bottom:5px;width:var(--w);transform:translateX(var(--x));border-radius:999px;pointer-events:none;
  background:linear-gradient(180deg,rgba(255,255,255,.4),rgba(255,255,255,.16));box-shadow:inset 0 1px 0 rgba(255,255,255,.7),0 4px 16px rgba(0,0,0,.35);
  transition:transform .5s cubic-bezier(.3,1.35,.5,1),width .5s cubic-bezier(.3,1.35,.5,1)}
.sw button{position:relative;z-index:1;border:0;background:none;color:rgba(255,255,255,.72);font:inherit;font-size:15px;font-weight:600;letter-spacing:-.01em;padding:10px 20px;border-radius:999px;cursor:pointer;white-space:nowrap;-webkit-tap-highlight-color:transparent;transition:color .25s}
.sw button.on{color:#fff}
.sw button:focus-visible{outline:2px solid #fff;outline-offset:2px}
